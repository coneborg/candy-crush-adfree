name: Build Standalone Candy Crush APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build APK via Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html style.css game.js audio.js candies.js bg.jpg icon.png manifest.json sw.js www/
          npx cap init "Candy Crush" "com.coneborg.candycrush" --web-dir "www"
          npx cap add android
          npx cap copy android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./CandyCrush-AdFree.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CandyCrush-AdFree-APK
          path: ./CandyCrush-AdFree.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: Candy Crush Ad-Free v1.0.0
          body: |
            🍬 **Candy Crush Standalone Android APK (Ad-Free)**
            - Standalone native Android APK (works 100% offline)
            - Unlimited lives & zero adverts
            - Download `CandyCrush-AdFree.apk` below and install on Android
          files: ./CandyCrush-AdFree.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
